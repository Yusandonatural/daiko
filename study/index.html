<main>
  <p style="font-size:3rem;margin:0">🚚</p>
  <h1>おひっこし しました</h1>
  <p>「まいにち30ぷん」は あたらしい ばしょに うつりました。<br>じどうで ひらくので まってね。</p>
  <a href="https://yusandonatural.github.io/family/study/">あたらしい ページを ひらく</a>
  <p style="font-size:.85rem;color:#8a7a70">ホーム画面に追加している場合は、新しいページで追加しなおしてください。<br>同じ端末なら記録はそのまま引き継がれます。</p>
</main>
<script>
  // 古いオフライン用キャッシュを消してから 新しい URL へ
  (async () => {
    try {
      if ('serviceWorker' in navigator) (await navigator.serviceWorker.getRegistrations()).forEach((r) => r.unregister());
      if (window.caches) (await caches.keys()).forEach((k) => caches.delete(k));
    } catch (e) { /* 何もしない */ }
    location.replace('https://yusandonatural.github.io/family/study/' + location.hash);
  })();
</script>
